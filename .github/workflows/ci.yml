name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch. Six jobs, two of them Docker builds; pushing three
# times in a minute should not queue three full pipelines.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only credentials for the ephemeral CI database.
  MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ajour
  APP_DATABASE_URL: postgres://ajour_app:ajour_app@localhost:5432/ajour
  AUTH_DATABASE_URL: postgres://ajour_auth:ajour_auth@localhost:5432/ajour
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
  BETTER_AUTH_URL: http://localhost:3000

jobs:
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Tests (RLS isolation)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ajour
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ajour"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations create the roles and the test global-setup gives them
      # LOGIN + the passwords embedded in the URLs above.
      - run: pnpm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  image:
    name: Docker image (migrator and runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The images are what production runs; a COPY of a file that moved
      # only shows up here, not in pnpm build. Both targets, no push.
      - run: docker build --target migrator -t ajour-migrator:ci .
      - run: docker build --target runner -t ajour-runner:ci .

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --prod, because this gate is about what ships. The dev tree pulls
      # in eslint's and drizzle-kit's own transitive advisories, which
      # never reach a running Ajour, and a required check that is red for
      # reasons nobody can act on is a check people learn to ignore.
      # `pnpm audit` without the flag is still worth running by hand.
      - run: pnpm audit --prod --audit-level high

  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.24.3
          GITLEAKS_SHA256=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # The scan runs on every pull request, from every fork. A tarball
          # fetched over the network and executed unchecked is a way in;
          # the published checksum closes it.
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact .
