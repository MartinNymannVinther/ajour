# Production compose for Ajour, designed to be run by Coolify on an EU VPS.
# See docs/deploy.md. All secrets come from the environment (Coolify UI);
# nothing here has a real default.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ajour
      AJOUR_APP_PASSWORD: ${AJOUR_APP_PASSWORD:?set AJOUR_APP_PASSWORD}
      AJOUR_AUTH_PASSWORD: ${AJOUR_AUTH_PASSWORD:?set AJOUR_AUTH_PASSWORD}
    volumes:
      - ajour-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ajour"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?}@db:5432/ajour
      # The migration step is what gives the runtime roles their login
      # rights: the Postgres init directory is bind-mounted from the
      # repository and is empty on a build system that cleans up after
      # itself. Learned the hard way on the first deploy.
      AJOUR_APP_PASSWORD: ${AJOUR_APP_PASSWORD:?}
      AJOUR_AUTH_PASSWORD: ${AJOUR_AUTH_PASSWORD:?}
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
      args:
        # Coolify and any CI runner should pass these so the running app can
        # name the code it was built from. Unset means "unknown", not a lie.
        AJOUR_COMMIT: ${AJOUR_COMMIT:-}
        AJOUR_BUILT_AT: ${AJOUR_BUILT_AT:-}
    restart: unless-stopped
    environment:
      APP_DATABASE_URL: postgres://ajour_app:${AJOUR_APP_PASSWORD:?}@db:5432/ajour
      AUTH_DATABASE_URL: postgres://ajour_auth:${AJOUR_AUTH_PASSWORD:?}@db:5432/ajour
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL, e.g. https://ajour.haij.dk}
      # Everything optional, forwarded explicitly.
      #
      # A variable set in Coolify reaches this file for `${...}`
      # substitution; it does not reach the container unless it is named
      # here. Until it was, setting LLM_PROVIDER and MISTRAL_API_KEY in
      # the panel did nothing at all: the app started, defaulted to no
      # model, and quietly answered with the rules engine. A deployment
      # that ignores half its own configuration without saying so is
      # worse than one that refuses to start.
      #
      # `:-` leaves an unset variable as the empty string, and env.ts
      # reads an empty string as absent, so an unset variable here is the
      # same thing as no variable at all.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      SIGNUP: ${SIGNUP:-}
      DEMO: ${DEMO:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-}
      CRON_SECRET: ${CRON_SECRET:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-}
    # No published port. Coolify's proxy reaches the app over the compose
    # network and terminates TLS in front of it; binding 0.0.0.0:3000 as
    # well would put the same app on the VPS's public address in cleartext,
    # outside the proxy, its TLS and its HSTS. Anyone running this without
    # a proxy should bind loopback explicitly and put one in front.
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  ajour-pgdata:
